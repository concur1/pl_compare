on: [push]
jobs:
  test:
    runs-on: codeberg-tiny
    strategy:
      fail-fast: false
      matrix:
        configs:
          - { polars-version: "2.0",  python-version: "3.12" }
          - { polars-version: "2.0",  python-version: "3.13" }

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v3
        with:
          fetch-depth: 0
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv python pin '${{ matrix.configs.python-version }}'

      - name: Install dependencies
        run: |
          uv remove polars
          uv add 'polars==${{ matrix.configs.polars-version }}'
          uv sync 

      - name: Run checks
        run: |
          uv run make check

      - name: Run benchmarks
        run: |
          uv run make bench
