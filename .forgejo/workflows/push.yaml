# Codeberg's hosted runner `codeberg-tiny` is capped at 1 CPU / 2G / 2 min
# (codeberg.org/actions/meta), which a cold `uv sync` + `make check` exceeds,
# so the test job runs on `codeberg-small` (2 CPU / 4G / 5 min). The benchmark
# is only run on GitHub Actions (uncapped runners); see .github/workflows/on_push.yaml.
on: [push]
jobs:
  test:
    runs-on: codeberg-small
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        configs:
          - { polars-version: "2.0",  python-version: "3.12" }
          - { polars-version: "2.0",  python-version: "3.13" }

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v3
        with:
          fetch-depth: 0
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv python pin '${{ matrix.configs.python-version }}'

      - name: Install dependencies
        run: |
          uv remove polars
          uv add 'polars==${{ matrix.configs.polars-version }}'
          uv sync 

      - name: Run checks
        run: |
          uv run make check
